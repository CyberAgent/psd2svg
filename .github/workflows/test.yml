name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Check MS Core Fonts package version
        id: core-fonts
        run: |
          sudo apt-get update
          version=$(apt-cache policy ttf-mscorefonts-installer | awk '/Candidate:/ { print $2 }')
          test -n "$version" && test "$version" != "(none)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The update-notifier downloader deletes each .exe after extraction, so
      # cache a separate copy of the original archives in the runner's temp dir.
      - name: Restore MS Core Fonts archives
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/mscorefonts-archives
          key: mscorefonts-${{ runner.os }}-${{ steps.core-fonts.outputs.version }}

      - name: Install fonts
        env:
          FONT_ARCHIVES: ${{ runner.temp }}/mscorefonts-archives
        run: |
          echo ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            cabextract \
            fontconfig \
            fonts-noto-core \
            fonts-noto-cjk \
            fonts-noto-ui-core

          # Read URLs and checksums from the candidate Ubuntu package. The
          # package version is also the cache key, so changed archives cannot
          # be silently reused after a package update.
          package_dir=$(mktemp -d)
          (cd "$package_dir" && apt-get download ttf-mscorefonts-installer)
          dpkg-deb -x "$package_dir"/*.deb "$package_dir/unpacked"
          manifest="$package_dir/unpacked/usr/share/package-data-downloads/ttf-mscorefonts-installer"
          test -f "$manifest"
          mkdir -p "$FONT_ARCHIVES"
          archives=()
          while read -r url sha256; do
            archive="$FONT_ARCHIVES/${url##*/}"
            if ! printf '%s  %s\n' "$sha256" "$archive" | sha256sum --check --status; then
              rm -f "$archive"
              curl --fail --location --retry 3 --retry-delay 5 \
                --connect-timeout 20 --max-time 180 --output "$archive.tmp" "$url"
              printf '%s  %s\n' "$sha256" "$archive.tmp" | sha256sum --check --status
              mv "$archive.tmp" "$archive"
            fi
            archives+=("$archive")
          done < <(awk '/^Url: / { url=$2 } /^Sha256: / { print url, $2 }' "$manifest")
          test "${#archives[@]}" -gt 0

          # Extract the verified, unmodified archives locally. Installing the
          # package itself would invoke update-notifier and fetch them again.
          sudo mkdir -p /usr/share/fonts/truetype/msttcorefonts
          sudo cabextract -q -d /usr/share/fonts/truetype/msttcorefonts "${archives[@]}"
          sudo fc-cache -fv
          # Match on :family= so Arial Black cannot satisfy the Arial check.
          installed() { [ -n "$(fc-list ":family=$1" file)" ]; }
          for family in "Times New Roman" "Arial"; do
            installed "$family" || {
              echo "::error::MS Core Fonts install failed: $family is missing"
              exit 1
            }
          done

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev -p ${{ matrix.python-version }}

      # Exercise the optional browser rasterizer on one supported Python
      # version. Keep the browser executable installation explicit: importing
      # Playwright alone is not enough to run these tests.
      - name: Install browser test dependencies
        if: matrix.python-version == '3.13'
        run: |
          uv sync --group dev --extra browser -p ${{ matrix.python-version }}
          uv run playwright install --with-deps chromium

      - name: Run linting
        run: uv run ruff check src/ tests/

      - name: Run formatting check
        run: uv run ruff format --check src/ tests/

      - name: Run type checking
        run: uv run mypy src/ tests/

      - name: Run tests
        run: uv run pytest

  test-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # Reduced matrix: only test min and max supported versions
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev -p ${{ matrix.python-version }}

      # Skip linting, formatting, and type checking on Windows
      # These are platform-independent and already verified on Linux

      - name: Run tests
        run: uv run pytest

      - name: Run Windows-specific font resolution tests
        run: uv run pytest tests/test_windows_fonts.py::TestWindowsRegistryIntegration -v
