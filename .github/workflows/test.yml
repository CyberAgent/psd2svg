name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Install fonts
        run: |
          sudo apt-get update
          echo ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ttf-mscorefonts-installer \
            fontconfig \
            fonts-noto-core \
            fonts-noto-cjk \
            fonts-noto-ui-core
          sudo fc-cache -fv
          # ttf-mscorefonts-installer downloads and extracts through an
          # update-notifier hook, not its own postinst. When that hook loses
          # its partial files the step reports "The fonts are NOT installed."
          # and apt still exits 0, leaving the suite to render Arial and Times
          # New Roman in a fallback face. Re-run the downloader once, then
          # assert. Match on :family= so that Arial Black, which ships in a
          # separate archive, cannot satisfy the check for Arial.
          installed() { [ -n "$(fc-list ":family=$1" file)" ]; }
          if ! installed "Times New Roman" || ! installed "Arial"; then
            sudo rm -f /var/lib/update-notifier/package-data-downloads/ttf-mscorefonts-installer*
            sudo /usr/lib/update-notifier/package-data-downloader
            sudo fc-cache -fv
          fi
          for family in "Times New Roman" "Arial"; do
            installed "$family" || {
              echo "::error::MS Core Fonts install failed: $family is missing"
              exit 1
            }
          done

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev -p ${{ matrix.python-version }}

      - name: Run linting
        run: uv run ruff check src/ tests/

      - name: Run formatting check
        run: uv run ruff format --check src/ tests/

      - name: Run type checking
        run: uv run mypy src/ tests/

      - name: Run tests
        run: uv run pytest

  test-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # Reduced matrix: only test min and max supported versions
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev -p ${{ matrix.python-version }}

      # Skip linting, formatting, and type checking on Windows
      # These are platform-independent and already verified on Linux

      - name: Run tests
        run: uv run pytest

      - name: Run Windows-specific font resolution tests
        run: uv run pytest tests/test_windows_fonts.py::TestWindowsRegistryIntegration -v
